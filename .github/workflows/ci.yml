name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
    # Docs-only pushes skip CI. Pull requests always run, so required checks still report.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.cursor/**'
  # The release workflow runs this same workflow before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentic_test
          POSTGRES_PASSWORD: agentic_test
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_test -d agentic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # One Bun version, from packageManager in package.json.
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://agentic_test:agentic_test@127.0.0.1:5432/agentic_test?schema=public
          TEST_DATABASE_URL: postgresql://agentic_test:agentic_test@127.0.0.1:5432/agentic_test?schema=public
        run: |
          bun run db:deploy
          bun run test:integration

      - name: Build application
        run: bun run build

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: agentic:ci
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,scope=ci-runtime,mode=max

      - name: Scan runtime image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: agentic:ci
          cache-db: true
          fail-build: true
          severity-cutoff: high
          only-fixed: true
